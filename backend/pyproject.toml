[project]
name = "open-grokbot"
version = "0.1.0"
description = "Open GrokBot Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "litellm>=1.50.0",
    "redis>=5.2.0",
    "docker>=7.1.0",
    "playwright>=1.49.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "ai[vercel]==0.8.0",
    "vercel-sandbox==0.8.0",
    "mcp==1.30.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "minio>=7.2.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
